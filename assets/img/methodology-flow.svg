<svg viewBox="0 0 980 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mtitle mdesc" font-family="'JetBrains Mono', monospace">
  <title id="mtitle">Five-phase penetration testing methodology</title>
  <desc id="mdesc">Reconnaissance leads to scanning and enumeration, then gaining access, then maintaining access, then reporting and cleanup, shown as a left-to-right flow.</desc>
  <rect width="980" height="220" fill="#0b0e13"/>

  <!-- connecting line -->
  <line x1="90" y1="110" x2="890" y2="110" stroke="#263140" stroke-width="2"/>

  <!-- nodes -->
  <g font-size="12" text-anchor="middle">
    <!-- 1 -->
    <g transform="translate(90,110)">
      <circle r="34" fill="#173934" stroke="#2bd9c9" stroke-width="2"/>
      <text y="5" fill="#2bd9c9" font-size="14" font-weight="700">01</text>
      <text y="60" fill="#e9eef3" font-size="13">Reconnaissance</text>
      <text y="78" fill="#5c6c7d" font-size="11">passive + active recon</text>
    </g>
    <!-- 2 -->
    <g transform="translate(290,110)">
      <circle r="34" fill="#173934" stroke="#2bd9c9" stroke-width="2"/>
      <text y="5" fill="#2bd9c9" font-size="14" font-weight="700">02</text>
      <text y="60" fill="#e9eef3" font-size="13">Scanning &amp; Enum</text>
      <text y="78" fill="#5c6c7d" font-size="11">nmap, service enum</text>
    </g>
    <!-- 3 -->
    <g transform="translate(490,110)">
      <circle r="34" fill="#3a2c14" stroke="#f2a93c" stroke-width="2"/>
      <text y="5" fill="#f2a93c" font-size="14" font-weight="700">03</text>
      <text y="60" fill="#e9eef3" font-size="13">Gaining Access</text>
      <text y="78" fill="#5c6c7d" font-size="11">exploitation</text>
    </g>
    <!-- 4 -->
    <g transform="translate(690,110)">
      <circle r="34" fill="#3a1a1a" stroke="#ef5d5d" stroke-width="2"/>
      <text y="5" fill="#ef5d5d" font-size="14" font-weight="700">04</text>
      <text y="60" fill="#e9eef3" font-size="13">Post-Exploitation</text>
      <text y="78" fill="#5c6c7d" font-size="11">privesc, persistence</text>
    </g>
    <!-- 5 -->
    <g transform="translate(890,110)">
      <circle r="34" fill="#241f3d" stroke="#9c8cf5" stroke-width="2"/>
      <text y="5" fill="#9c8cf5" font-size="14" font-weight="700">05</text>
      <text y="60" fill="#e9eef3" font-size="13">Reporting</text>
      <text y="78" fill="#5c6c7d" font-size="11">cleanup + writeup</text>
    </g>
  </g>
</svg>
