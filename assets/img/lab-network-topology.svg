<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="labtitle labdesc" font-family="'JetBrains Mono', monospace">
  <title id="labtitle">Isolated home-lab network topology</title>
  <desc id="labdesc">A host computer running VirtualBox with a host-only or NAT network containing a Kali Linux attacker VM and an intentionally vulnerable target VM, isolated from the internet and the home network.</desc>
  <rect width="900" height="360" fill="#0b0e13"/>
  <rect x="1" y="1" width="898" height="358" fill="none" stroke="#263140" stroke-width="1"/>

  <!-- host machine outer boundary -->
  <rect x="40" y="40" width="820" height="280" rx="16" fill="none" stroke="#26313f" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="60" y="70" fill="#5c6c7d" font-size="13" letter-spacing="1">HOST MACHINE (your laptop/desktop)</text>

  <!-- virtualbox boundary -->
  <rect x="90" y="95" width="720" height="200" rx="14" fill="#121822" stroke="#2bd9c9" stroke-width="1.5"/>
  <text x="110" y="122" fill="#2bd9c9" font-size="13" letter-spacing="1">VIRTUALBOX — ISOLATED HOST-ONLY / NAT NETWORK</text>

  <!-- Kali VM -->
  <g transform="translate(150,150)">
    <rect width="230" height="120" rx="10" fill="#171f2b" stroke="#2bd9c9" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="6" fill="#ef5d5d"/>
    <circle cx="46" cy="26" r="6" fill="#f2a93c"/>
    <circle cx="66" cy="26" r="6" fill="#2bd9c9"/>
    <text x="20" y="58" fill="#e9eef3" font-size="15" font-weight="700">Kali Linux VM</text>
    <text x="20" y="80" fill="#91a3b6" font-size="12">attacker workstation</text>
    <text x="20" y="100" fill="#2bd9c9" font-size="12">10.0.10.10</text>
  </g>

  <!-- Target VM -->
  <g transform="translate(520,150)">
    <rect width="230" height="120" rx="10" fill="#171f2b" stroke="#f2a93c" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="6" fill="#ef5d5d"/>
    <circle cx="46" cy="26" r="6" fill="#f2a93c"/>
    <circle cx="66" cy="26" r="6" fill="#2bd9c9"/>
    <text x="20" y="58" fill="#e9eef3" font-size="15" font-weight="700">Target VM</text>
    <text x="20" y="80" fill="#91a3b6" font-size="12">Metasploitable / DVWA</text>
    <text x="20" y="100" fill="#f2a93c" font-size="12">10.0.10.20</text>
  </g>

  <!-- connection -->
  <line x1="380" y1="210" x2="520" y2="210" stroke="#5c6c7d" stroke-width="2"/>
  <circle cx="450" cy="210" r="3" fill="#5c6c7d"/>

  <!-- no internet marker -->
  <g transform="translate(400,240)">
    <text x="0" y="0" fill="#5c6c7d" font-size="11" text-anchor="middle">isolated segment</text>
  </g>

  <text x="60" y="345" fill="#5c6c7d" font-size="12">No bridged adapter to the internet or your home LAN — every scan and exploit stays inside this box.</text>
</svg>
